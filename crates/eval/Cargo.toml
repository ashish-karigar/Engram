[package]
name = "engram-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "engram-eval"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
engram-core = { path = "../core" }
engram-code = { path = "../code" }
engram-understand = { path = "../understand" }
engram-embed = { path = "../embed" }
engram-rag = { path = "../rag" }
engram-serve = { path = "../serve" }
engram-sessions = { path = "../sessions" }
hex = "0.4.3"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
