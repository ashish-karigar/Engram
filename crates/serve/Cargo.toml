[package]
name = "engram-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
engram-code = { path = "../code" }
engram-core = { path = "../core" }
engram-understand = { path = "../understand" }
engram-embed = { path = "../embed" }
engram-rag = { path = "../rag" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
