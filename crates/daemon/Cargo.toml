[package]
name = "engram-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engram-core = { path = "../core" }
engram-code = { path = "../code" }
engram-capture = { path = "../capture" }
engram-understand = { path = "../understand" }
engram-serve = { path = "../serve" }
engram-embed = { path = "../embed" }
engram-rag = { path = "../rag" }
engram-sessions = { path = "../sessions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
chrono = "0.4.45"

[[bin]]
name = "engram"
path = "src/main.rs"

[dev-dependencies]
engram-sessions = { path = "../sessions" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "3.27.0"
